<!DOCTYPE html>
<html>
<body>

<h1>TEST PAGE</h1>
<pre id="out">Loading…</pre>

<script>
async function load() {
  try {
    const res = await fetch("https://bot.krishan-p5696.workers.dev");
    const data = await res.json();

    let out = "";
    for (const item of data) {
      out += item.value + "\n";
    }

    document.getElementById("out").innerText = out || "(no data)";
  } catch (e) {
    document.getElementById("out").innerText = "Error: " + e;
  }
}

load();
setInterval(load, 1000);
</script>


  
<h2>Live Prices</h2>
<table id="tbl" border="1" cellspacing="0" cellpadding="4">
  <thead><tr><th>Coin</th><th>Price</th></tr></thead>
  <tbody></tbody>
</table>

<script>
// --------------------------
// 1) GET METADATA
// --------------------------
async function loadCoins() {
    const r = await fetch("https://api.hyperliquid.xyz/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "metaAndAssetCtxs" })
    });
    const data = await r.json();
    const universe = data[0].universe;     // list of coin metadata

    return universe
        .filter(x => !x.isDelisted)
        .map(x => x.name);                 // coin symbols
}

// --------------------------
// 2) OPEN WS + SUBSCRIBE
// --------------------------
function subscribe(coins) {
    const ws = new WebSocket("wss://api.hyperliquid.xyz/ws");
    const tbody = document.querySelector("#tbl tbody");
    const rows = {};  // coin -> row element

    ws.onopen = () => {
        coins.forEach(c => {
            ws.send(JSON.stringify({
                method: "subscribe",
                subscription: { type: "candle", coin: c, interval: "1h" }
            }));
        });
    };

    ws.onmessage = ev => {
        let msgs;
        try { msgs = JSON.parse(ev.data); }
        catch { return; }
        if (!Array.isArray(msgs)) msgs = [msgs];

        msgs.forEach(msg => {
            if (msg.channel !== "candle") return;
            const d = msg.data;
            const coin = d.s;
            const price = d.c;

            if (!rows[coin]) {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${coin}</td><td id="p-${coin}">-</td>`;
                tbody.appendChild(tr);
                rows[coin] = true;
            }
            document.getElementById(`p-${coin}`).innerText = price;
        });
    };
}

// --------------------------
// 3) MAIN
// --------------------------
(async () => {
    const coins = await loadCoins();
    subscribe(coins);
})();
</script>

</body>
</html>

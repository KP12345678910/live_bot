<script>
async function load() {
  const data = await fetch("https://bot.krishan-p5696.workers.dev")
    .then(r => r.json());

  let out = "";
  for (const item of data) {
    out += `${item.key}: ${item.value}\n`;
  }

  document.getElementById("out").innerText = out;
}

setInterval(load, 1000);
load();
</script>

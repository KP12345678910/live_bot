<!DOCTYPE html>
<html>
<body>

<h1>TEST PAGE</h1>
<pre id="out">Loading…</pre>

<script>
async function load() {
  try {
    const res = await fetch("https://bot.krishan-p5696.workers.dev");
    const data = await res.json();

    let out = "";
    for (const item of data) {
      out += item.value + "\n";
    }

    document.getElementById("out").innerText = out || "(no data)";
  } catch (e) {
    document.getElementById("out").innerText = "Error: " + e;
  }
}

load();
setInterval(load, 1000);
</script>


  
<h2>Live Prices</h2>
<table id="tbl" border="1" cellspacing="0" cellpadding="4">
  <thead><tr><th>Coin</th><th>Price</th></tr></thead>
  <tbody></tbody>
</table>
<script>
async function loadCoins() {
    const r = await fetch("https://api.hyperliquid.xyz/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "metaAndAssetCtxs" })
    });
    const x = await r.json();
    return x[0].universe
        .filter(u => !u.isDelisted)
        .map(u => u.name);
}

let buf = {};     // coin -> price
let frame = false;

// batch render every ~100ms
function flush() {
    const tbody = document.querySelector("#tbl tbody");
    let html = "";
    for (const [c,p] of Object.entries(buf)) {
        html += `<tr><td>${c}</td><td>${p}</td></tr>`;
    }
    tbody.innerHTML = html;
    frame = false;
}

function subscribe(coins) {
    const ws = new WebSocket("wss://api.hyperliquid.xyz/ws");

    ws.onopen = () => {
        // send all subscribe messages fast
        const arr = coins.map(c => ({
            method:"subscribe",
            subscription:{type:"candle",coin:c,interval:"1h"}
        }));
        arr.forEach(m => ws.send(JSON.stringify(m)));
    };

    ws.onmessage = e => {
        let msgs;
        try { msgs = JSON.parse(e.data); } catch { return; }
        if (!Array.isArray(msgs)) msgs = [msgs];

        for (const m of msgs) {
            if (m.channel !== "candle") continue;
            const d = m.data;
            buf[d.s] = d.c;
        }

        if (!frame) {
            frame = true;
            setTimeout(flush, 100);
        }
    };
}

(async () => {
    const coins = await loadCoins();
    subscribe(coins);   // subscribe to ALL coins
})();
</script>

</body>
</html>

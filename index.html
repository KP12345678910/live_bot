<!DOCTYPE html>
<html>
<body>

<h1>TEST PAGE</h1>
<pre id="out">Loading…</pre>

<script>
async function load() {
  try {
    const res = await fetch("https://bot.krishan-p5696.workers.dev");
    const data = await res.json();

    let out = "";
    for (const item of data) {
      out += item.value + "\n";
    }

    document.getElementById("out").innerText = out || "(no data)";
  } catch (e) {
    document.getElementById("out").innerText = "Error: " + e;
  }
}

load();
setInterval(load, 1000);
</script>


  
<h2>Live Prices</h2>
<table id="tbl" border="1" cellspacing="0" cellpadding="4">
  <thead><tr><th>Coin</th><th>Price</th></tr></thead>
  <tbody></tbody>
</table>
<script>
// --------------------------
// 1) load coins (same as before)
// --------------------------
async function loadCoins() {
    const r = await fetch("https://api.hyperliquid.xyz/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "metaAndAssetCtxs" })
    });
    const x = await r.json();
    return x[0].universe
        .filter(u => !u.isDelisted)
        .map(u => u.name);
}

// --------------------------
// 2) build table ONCE
// --------------------------
const priceCells = {};  // coin -> <td>

function buildTable(coins) {
    const tbody = document.querySelector("#tbl tbody");
    let html = "";

    coins.forEach(c => {
        html += `<tr><td>${c}</td><td id="p-${c}">-</td></tr>`;
    });

    tbody.innerHTML = html;

    // cache references to td elements
    coins.forEach(c => {
        priceCells[c] = document.getElementById(`p-${c}`);
    });
}

// --------------------------
// 3) subscribe and update direct DOM refs
// --------------------------
function subscribe(coins) {
    const ws = new WebSocket("wss://api.hyperliquid.xyz/ws");

    ws.onopen = () => {
        coins.forEach(c => {
            ws.send(JSON.stringify({
                method: "subscribe",
                subscription: { type: "candle", coin: c, interval: "1h" }
            }));
        });
    };

    ws.onmessage = e => {
        let msgs;
        try { msgs = JSON.parse(e.data); } catch { return; }
        if (!Array.isArray(msgs)) msgs = [msgs];

        msgs.forEach(msg => {
            if (msg.channel !== "candle") return;
            const d = msg.data;
            const td = priceCells[d.s];
            if (td) td.innerText = d.c;  // ONLY update this cell
        });
    };
}

// --------------------------
// 4) main
// --------------------------
(async () => {
    const coins = await loadCoins();
    buildTable(coins);      // build once
    subscribe(coins);       // update only changed cells
})();
</script>

</body>
</html>

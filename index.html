<!DOCTYPE html>
<html>
<body>

<h1>TEST PAGE</h1>
<pre id="out">Loading…</pre>

<script>
async function load() {
  try {
    const res = await fetch("https://bot.krishan-p5696.workers.dev");
    const data = await res.json();

    let out = "";
    for (const item of data) {
      out += item.value + "\n";
    }

    document.getElementById("out").innerText = out || "(no data)";
  } catch (e) {
    document.getElementById("out").innerText = "Error: " + e;
  }
}

load();
setInterval(load, 1000);
</script>



<h2>Live Prices</h2>
<pre id="prices">loading…</pre>

<script>
// ------------------------------
// MOST EFFICIENT POSSIBLE VERSION
// ------------------------------
async function loadCoins() {
    const r = await fetch("https://api.hyperliquid.xyz/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "metaAndAssetCtxs" })
    });
    const x = await r.json();
    return x[0].universe
        .filter(u => !u.isDelisted)
        .map(u => u.name);
}

let prices = {};         // coin -> last price
let needsRender = false; // render flag

function render() {
    const block = document.getElementById("prices");

    // FASTEST POSSIBLE RENDER: array → join → textContent
    block.textContent = Object.entries(prices)
        .map(([c, p]) => `${c}: ${p}`)
        .join("\n");

    needsRender = false;
}

function subscribe(coins) {
    const ws = new WebSocket("wss://api.hyperliquid.xyz/ws");

    ws.onopen = () => {
        coins.forEach(c => {
            ws.send(JSON.stringify({
                method: "subscribe",
                subscription: { type: "candle", coin: c, interval: "1h" }
            }));
        });
    };

    ws.onmessage = e => {
        let msgs;
        try { msgs = JSON.parse(e.data); }
        catch { return; }
        if (!Array.isArray(msgs)) msgs = [msgs];

        for (const m of msgs) {
            if (m.channel !== "candle") continue;
            const d = m.data;
            prices[d.s] = d.c;  // store latest price
        }

        // REQUEST ANIMATION FRAME RENDER (fastest scheduling)
        if (!needsRender) {
            needsRender = true;
            requestAnimationFrame(render);
        }
    };
}

// ------------------------------
// MAIN
// ------------------------------
(async () => {
    const coins = await loadCoins();
    subscribe(coins);
})();
</script>

</body>
</html>
